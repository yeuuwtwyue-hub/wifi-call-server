<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Việt Call</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#0b0f17;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:94%;
  max-width:430px;
  background:#151b26;
  border-radius:24px;
  padding:24px;
  box-shadow:0 15px 50px #0009;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.sub{
  text-align:center;
  color:#8f9aaa;
  margin-bottom:24px;
}

input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid #303949;
  border-radius:13px;
  background:#0d121b;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#287cff;
}

button:disabled{
  opacity:.45;
}

.secondary{
  background:#303846;
}

.danger{
  background:#e5484d;
}

#message{
  min-height:22px;
  text-align:center;
  margin:15px 0;
  color:#70e6a0;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.user{
  text-align:center;
  color:#70e6a0;
  margin-bottom:20px;
}

.callBox{
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid #303949;
}

#callStatus{
  text-align:center;
  color:#aeb7c6;
  margin:15px 0;
}

.hidden{
  display:none;
}

.small{
  text-align:center;
  color:#697486;
  font-size:12px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

<!-- ĐĂNG NHẬP -->
<div id="loginPage" class="page active">

<h1>📞 Việt Call</h1>

<div class="sub">
Đăng nhập tài khoản
</div>

<input id="loginUser" placeholder="Tên đăng nhập">

<input
id="loginPass"
type="password"
placeholder="Mật khẩu">

<button id="loginBtn">
🔑 Đăng nhập
</button>

<button class="secondary" id="showRegister">
📝 Tạo tài khoản
</button>

</div>


<!-- ĐĂNG KÝ -->
<div id="registerPage" class="page">

<h1>📝 Đăng ký</h1>

<div class="sub">
Tạo tài khoản Việt Call
</div>

<input id="registerUser" placeholder="Tên đăng nhập">

<input
id="registerPass"
type="password"
placeholder="Mật khẩu">

<button id="registerBtn">
✅ Đăng ký
</button>

<button class="secondary" id="showLogin">
⬅️ Quay lại đăng nhập
</button>

</div>


<!-- TRANG CHÍNH -->
<div id="homePage" class="page">

<h1>💬 Việt Call</h1>

<div class="user">
Xin chào, <span id="username"></span>
</div>

<input
id="room"
placeholder="Mã phòng, ví dụ 1234"
maxlength="30">

<button id="join">
📞 Tham gia phòng
</button>

<div id="callBox" class="callBox hidden">

<div id="callStatus">
Chưa kết nối
</div>

<button
class="secondary"
id="mic"
disabled>
🎙️ Tắt mic
</button>

<button
class="danger"
id="hang"
disabled>
🔴 Kết thúc
</button>

</div>

<button
class="secondary"
id="logout">
🚪 Đăng xuất
</button>

<div class="small">
Việt Call • Voice Calling
</div>

</div>

<div id="message"></div>

</div>


<script>

const SERVER =
"https://wifi-call-server-1.onrender.com";

let ws = null;
let pc = null;
let stream = null;
let room = null;
let currentUser = null;

const $ = id =>
document.getElementById(id);


function showPage(id){

  document.querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove("active")
    );

  $(id).classList.add("active");

}


function message(text,color){

  $("message").textContent = text;

  if(color){
    $("message").style.color = color;
  }

}


/* =========================
   ĐĂNG KÝ
========================= */

$("showRegister").onclick = () => {

  message("");

  showPage("registerPage");

};


$("showLogin").onclick = () => {

  message("");

  showPage("loginPage");

};


$("registerBtn").onclick = () => {

  const username =
    $("registerUser").value.trim();

  const password =
    $("registerPass").value;

  if(!username || !password){

    message(
      "⚠️ Nhập đầy đủ thông tin",
      "#ffcc66"
    );

    return;
  }

  const socket =
    new WebSocket(
      SERVER.replace(/^http/,"ws")
    );

  socket.onopen = () => {

    socket.send(JSON.stringify({
      type:"register",
      username,
      password
    }));

  };

  socket.onmessage = event => {

    const data =
      JSON.parse(event.data);

    if(data.type === "register-result"){

      message(
        data.message,
        data.success
          ? "#70e6a0"
          : "#ff7777"
      );

      if(data.success){

        $("registerUser").value = "";
        $("registerPass").value = "";

        setTimeout(() => {
          showPage("loginPage");
        },700);

      }

      socket.close();

    }

  };

};


/* =========================
   ĐĂNG NHẬP
========================= */

$("loginBtn").onclick = () => {

  const username =
    $("loginUser").value.trim();

  const password =
    $("loginPass").value;

  if(!username || !password){

    message(
      "⚠️ Nhập tài khoản và mật khẩu",
      "#ffcc66"
    );

    return;
  }

  const socket =
    new WebSocket(
      SERVER.replace(/^http/,"ws")
    );

  socket.onopen = () => {

    socket.send(JSON.stringify({
      type:"login",
      username,
      password
    }));

  };

  socket.onmessage = event => {

    const data =
      JSON.parse(event.data);

    if(data.type === "login-result"){

      if(data.success){

        currentUser =
          data.username;

        $("username").textContent =
          currentUser;

        $("loginUser").value = "";
        $("loginPass").value = "";

        message("");

        showPage("homePage");

      }else{

        message(
          data.message,
          "#ff7777"
        );

      }

      socket.close();

    }

  };

};


/* =========================
   GỌI ĐIỆN
========================= */

function signal(data){

  if(
    ws &&
    ws.readyState === WebSocket.OPEN
  ){

    ws.send(JSON.stringify(data));

  }

}


$("join").onclick = async () => {

  room =
    $("room").value.trim();

  if(!room){

    message(
      "⚠️ Nhập mã phòng",
      "#ffcc66"
    );

    return;
  }

  try{

    stream =
      await navigator.mediaDevices
      .getUserMedia({
        audio:true,
        video:false
      });

  }catch(error){

    message(
      "⚠️ Hãy cho phép sử dụng micro",
      "#ff7777"
    );

    return;

  }

  const wsUrl =
    SERVER.replace(/^http/,"ws");

  ws =
    new WebSocket(wsUrl);


  ws.onopen = () => {

    signal({
      type:"join",
      room
    });

    $("callBox")
      .classList.remove("hidden");

    $("join").disabled = true;
    $("room").disabled = true;

    $("mic").disabled = false;
    $("hang").disabled = false;

    $("callStatus").textContent =
      "🟢 Đã vào phòng, chờ người kia...";

  };


  ws.onmessage = async event => {

    const message =
      JSON.parse(event.data);


    if(message.type === "offer"){

      await makePC();

      await pc.setRemoteDescription(
        message.offer
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      signal({
        type:"answer",
        room,
        answer
      });

    }


    else if(message.type === "answer"){

      if(pc){

        await pc.setRemoteDescription(
          message.answer
        );

      }

    }


    else if(
      message.type === "candidate" &&
      pc
    ){

      try{

        await pc.addIceCandidate(
          message.candidate
        );

      }catch(error){}

    }


    else if(message.type === "peer-joined"){

      await makePC();

      const offer =
        await pc.createOffer();

      await pc.setLocalDescription(
        offer
      );

      signal({
        type:"offer",
        room,
        offer
      });

    }


    else if(message.type === "peer-left"){

      $("callStatus").textContent =
        "☎️ Người kia đã rời phòng";

    }

  };


  ws.onerror = () => {

    $("callStatus").textContent =
      "❌ Không kết nối được server";

  };

};


async function makePC(){

  if(pc) return;


  pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
          "stun:stun.l.google.com:19302"
        }
      ]

    });


  stream
    .getTracks()
    .forEach(track => {

      pc.addTrack(
        track,
        stream
      );

    });


  pc.onicecandidate =
    event => {

      if(event.candidate){

        signal({

          type:"candidate",
          room,
          candidate:
            event.candidate

        });

      }

    };


  pc.ontrack =
    event => {

      let audio =
        document.getElementById("remote");

      if(!audio){

        audio =
          document.createElement("audio");

        audio.id = "remote";
        audio.autoplay = true;

        document.body
          .appendChild(audio);

      }

      audio.srcObject =
        event.streams[0];

    };


  pc.onconnectionstatechange =
    () => {

      if(
        pc.connectionState ===
        "connected"
      ){

        $("callStatus")
          .textContent =
          "📞 Đang gọi";

      }

    };

}


/* =========================
   MICRO
========================= */

$("mic").onclick = () => {

  if(!stream) return;

  const track =
    stream.getAudioTracks()[0];

  track.enabled =
    !track.enabled;

  $("mic").textContent =
    track.enabled
      ? "🎙️ Tắt mic"
      : "🔇 Bật mic";

};


/* =========================
   KẾT THÚC
========================= */

$("hang").onclick = () => {

  if(stream){

    stream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

  }

  if(pc){

    pc.close();
    pc = null;

  }

  if(ws){

    ws.close();
    ws = null;

  }

  $("join").disabled = false;
  $("room").disabled = false;

  $("mic").disabled = true;
  $("hang").disabled = true;

  $("callBox")
    .classList.add("hidden");

  $("callStatus").textContent =
    "Chưa kết nối";

};


/* =========================
   ĐĂNG XUẤT
========================= */

$("logout").onclick = () => {

  $("hang").click();

  currentUser = null;

  showPage("loginPage");

};

</script>

</body>
</html>
