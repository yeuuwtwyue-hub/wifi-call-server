<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Call</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07111f;color:#fff;
 font-family:Arial,sans-serif
}
button,input{font:inherit}
button{border:0;cursor:pointer}
input{
 width:100%;padding:14px;border-radius:14px;
 border:1px solid #334155;background:#0f1b2d;
 color:#fff;outline:0
}
.hidden{display:none!important}

.top{
 background:#132238;padding:18px 20px;
 position:sticky;top:0;z-index:10;
 border-bottom:1px solid #263852
}
.logo{font-size:25px;font-weight:bold}
.user{color:#60a5fa;margin-top:5px}

.main{max-width:650px;margin:auto;padding:16px}

.card{
 background:#132238;border-radius:20px;
 padding:17px;margin-bottom:14px
}
.card h2{margin:0 0 13px;font-size:20px}

.row{display:flex;gap:8px}
.row input{flex:1}
.btn{
 padding:12px 16px;border-radius:12px;
 color:#fff;font-weight:bold
}
.blue{background:#2563eb}
.green{background:#16a34a}
.red{background:#dc2626}
.orange{background:#f59e0b}

.item{
 display:flex;align-items:center;
 justify-content:space-between;
 background:#0d192a;
 padding:11px;border-radius:14px;
 margin-top:8px
}
.left{display:flex;align-items:center;gap:10px}
.avatar{
 width:42px;height:42px;border-radius:50%;
 background:#2563eb;display:flex;
 align-items:center;justify-content:center;
 font-weight:bold
}
.name{font-weight:bold}
.online{font-size:12px;color:#22c55e}
.offline{font-size:12px;color:#94a3b8}

.auth{
 min-height:100vh;display:flex;
 justify-content:center;align-items:center;padding:20px
}
.authbox{
 width:100%;max-width:420px;
 background:#132238;padding:25px;
 border-radius:22px
}
.authbox h1{text-align:center}
.authbox input{margin:5px 0}
.authbox button{width:100%;margin-top:8px}
.status{text-align:center;color:#fbbf24;margin-top:10px}

#chat{
 background:#07111f;border-radius:15px;
 height:360px;overflow-y:auto;padding:10px
}
.msg{
 max-width:80%;background:#24354e;
 padding:9px 12px;border-radius:14px;
 margin:6px 0
}
.msg.me{background:#2563eb;margin-left:auto}
.msg small{display:block;color:#cbd5e1;margin-bottom:3px}

.chatHead{
 display:flex;align-items:center;
 gap:8px;margin-bottom:10px
}

.notice{
 text-align:center;color:#94a3b8;
 padding:8px;font-size:14px
}

.actions{display:flex;gap:6px}
.actions button{
 padding:8px 10px;border-radius:9px;color:#fff
}

.callBtns{
 display:flex;gap:7px
}
.callBtns button{flex:1;padding:13px;border-radius:12px}

#loginPage,#registerPage,#app{min-height:100vh}
</style>
</head>

<body>

<!-- ĐĂNG NHẬP -->
<div id="loginPage" class="auth hidden">
 <div class="authbox">
  <h1>📞 WiFi Call</h1>
  <p style="text-align:center;color:#94a3b8">
   Đăng nhập tài khoản
  </p>

  <input id="loginUser" placeholder="Tên đăng nhập">
  <input id="loginPass" type="password" placeholder="Mật khẩu">

  <button class="btn blue" onclick="login()">Đăng nhập</button>
  <button class="btn" style="background:#334155" onclick="showRegister()">
   Tạo tài khoản
  </button>

  <div id="loginStatus" class="status"></div>
 </div>
</div>

<!-- ĐĂNG KÝ -->
<div id="registerPage" class="auth hidden">
 <div class="authbox">
  <h1>📝 Đăng ký</h1>

  <input id="regUser" placeholder="Tên đăng nhập">
  <input id="regPass" type="password" placeholder="Mật khẩu">

  <button class="btn green" onclick="register()">Đăng ký</button>
  <button class="btn" style="background:#334155" onclick="showLogin()">
   Quay lại
  </button>

  <div id="regStatus" class="status"></div>
 </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

 <div class="top">
  <div class="logo">📞 WiFi Call</div>
  <div id="me" class="user"></div>
 </div>

 <div class="main">

  <!-- TÌM BẠN -->
  <div class="card">
   <h2>🔎 Tìm bạn</h2>

   <div class="row">
    <input id="search" placeholder="Nhập tên người dùng..."
      onkeydown="if(event.key==='Enter')searchUsers()">
    <button class="btn blue" onclick="searchUsers()">Tìm</button>
   </div>

   <div id="searchResult"></div>
  </div>

  <!-- LỜI MỜI -->
  <div class="card">
   <h2>🔔 Lời mời kết bạn</h2>
   <div id="requests">
    <div class="notice">Đang tải...</div>
   </div>
  </div>

  <!-- BẠN BÈ -->
  <div class="card">
   <h2>👥 Bạn bè</h2>
   <div id="friends">
    <div class="notice">Đang tải...</div>
   </div>
  </div>

  <!-- CHAT RIÊNG -->
  <div id="privateBox" class="card hidden">

   <div class="chatHead">
    <button class="btn" style="background:#334155"
      onclick="closeChat()">←</button>
    <h2 id="chatTitle" style="margin:0">Chat</h2>
   </div>

   <div id="chat"></div>

   <div class="row" style="margin-top:8px">
    <input id="chatInput" placeholder="Nhắn tin..."
      onkeydown="if(event.key==='Enter')sendChat()">
    <button class="btn green" onclick="sendChat()">Gửi</button>
   </div>

  </div>

  <!-- GỌI -->
  <div class="card">
   <h2>📞 Gọi</h2>

   <div class="row">
    <input id="room" placeholder="Tên phòng gọi">
    <button class="btn blue" onclick="joinRoom()">Vào</button>
   </div>

   <div id="roomStatus" class="notice">Chưa vào phòng</div>

   <div class="callBtns">
    <button class="green" onclick="call()">📞 Gọi</button>
    <button class="orange" onclick="mic()">🎤 Mic</button>
    <button class="red" onclick="hangup()">❌ Cúp</button>
   </div>

   <div id="callStatus" class="notice">Chưa gọi</div>
  </div>

  <!-- ĐĂNG XUẤT -->
  <div class="card">
   <button class="btn" style="background:#334155;width:100%"
    onclick="logout()">🚪 Đăng xuất</button>
  </div>

 </div>
</div>

<audio id="audio" autoplay></audio>

<script>

const SERVER="https://wifi-call-server-1.onrender.com";

let ws;
let username="";
let selected="";
let room="";
let stream=null;
let peer=null;


/* =========================
   GIAO DIỆN
========================= */

function showLogin(){
 document.getElementById("loginPage").classList.remove("hidden");
 document.getElementById("registerPage").classList.add("hidden");
 document.getElementById("app").classList.add("hidden");
}

function showRegister(){
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("registerPage").classList.remove("hidden");
}

function showApp(){
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("registerPage").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 document.getElementById("me").textContent="👤 "+username;

 loadFriends();
 loadRequests();
}


/* =========================
   KẾT NỐI
========================= */

function connect(){

 return new Promise((resolve,reject)=>{

  ws=new WebSocket(
   SERVER.replace("https","wss")
         .replace("http","ws")
  );

  const timer=setTimeout(
   ()=>reject(),
   8000
  );

  ws.onopen=()=>{
   clearTimeout(timer);
   resolve();
  };

  ws.onerror=()=>reject();

  ws.onmessage=e=>{
   try{
    handle(JSON.parse(e.data));
   }catch{}
  };

 });
}


/* =========================
   XỬ LÝ SERVER
========================= */

function handle(d){

 if(d.type==="login-result"){

  if(!d.success){
   document.getElementById("loginStatus").textContent=d.message;
   return;
  }

  username=d.username;

  ws.send(JSON.stringify({
   type:"create-session",
   username:document.getElementById("loginUser").value.trim(),
   password:document.getElementById("loginPass").value
  }));

  return;
 }


 if(d.type==="session-created"){

  if(d.success){

   localStorage.setItem(
    "wifiSession",
    JSON.stringify({
     username:d.username,
     token:d.token
    })
   );

   username=d.username;
   showApp();
  }

  return;
 }


 if(d.type==="session-result"){

  if(d.success){
   username=d.username;
   showApp();
  }else{
   localStorage.removeItem("wifiSession");
   showLogin();
  }

  return;
 }


 if(d.type==="register-result"){

  document.getElementById("regStatus").textContent=d.message;

  if(d.success){
   setTimeout(showLogin,700);
  }

  return;
 }


 if(d.type==="search-results"){
  renderSearch(d.users);
  return;
 }


 if(d.type==="friend-request-result"){
  alert(d.message);
  return;
 }


 if(d.type==="friend-request-received"){
  alert("🔔 "+d.from+" đã gửi lời mời kết bạn");
  loadRequests();
  return;
 }


 if(d.type==="friend-requests"){
  renderRequests(d.requests);
  return;
 }


 if(d.type==="friend-action-result"){
  alert(d.message);
  loadRequests();
  loadFriends();
  return;
 }


 if(d.type==="friend-added"){
  loadFriends();
  return;
 }


 if(d.type==="friend-list"){
  renderFriends(d.friends);
  return;
 }


 if(d.type==="private-chat-history"){

  selected=d.username;

  document.getElementById("privateBox")
   .classList.remove("hidden");

  document.getElementById("chatTitle")
   .textContent="💬 "+selected;

  const box=document.getElementById("chat");
  box.innerHTML="";

  d.messages.forEach(addMessage);

  box.scrollTop=box.scrollHeight;

  return;
 }


 if(d.type==="private-chat"){

  const m=d.message;

  if(
   selected===m.from ||
   selected===m.to
  ){
   addMessage(m);
  }

  return;
 }


 if(d.type==="private-chat-error"){
  alert(d.message);
  return;
 }


 if(d.type==="peer-joined"){
  document.getElementById("callStatus")
   .textContent="🟢 Có người đã vào phòng";
  return;
 }


 if(d.type==="peer-left"){
  closePeer();
  document.getElementById("callStatus")
   .textContent="Người kia đã rời phòng";
  return;
 }


 if(
  d.type==="offer" ||
  d.type==="answer" ||
  d.type==="ice-candidate"
 ){
  rtc(d);
 }

}


/* =========================
   ĐĂNG KÝ
========================= */

function register(){

 const u=document.getElementById("regUser").value.trim();
 const p=document.getElementById("regPass").value;

 if(!u||!p){
  document.getElementById("regStatus").textContent=
   "Nhập đầy đủ thông tin";
  return;
 }

 ws.send(JSON.stringify({
  type:"register",
  username:u,
  password:p
 }));

}


/* =========================
   ĐĂNG NHẬP
========================= */

function login(){

 const u=document.getElementById("loginUser").value.trim();
 const p=document.getElementById("loginPass").value;

 if(!u||!p){
  document.getElementById("loginStatus").textContent=
   "Nhập tài khoản và mật khẩu";
  return;
 }

 ws.send(JSON.stringify({
  type:"login",
  username:u,
  password:p
 }));

}


/* =========================
   TỰ ĐĂNG NHẬP
========================= */

function autoLogin(){

 const s=localStorage.getItem("wifiSession");

 if(!s){
  showLogin();
  return;
 }

 try{

  const x=JSON.parse(s);

  ws.send(JSON.stringify({
   type:"session-login",
   username:x.username,
   token:x.token
  }));

 }catch{

  localStorage.removeItem("wifiSession");
  showLogin();

 }

}


/* =========================
   TÌM BẠN
========================= */

function searchUsers(){

 const q=document.getElementById("search").value.trim();

 if(!q)return;

 ws.send(JSON.stringify({
  type:"search-users",
  query:q
 }));

}


function renderSearch(users){

 const box=document.getElementById("searchResult");
 box.innerHTML="";

 if(!users.length){
  box.innerHTML='<div class="notice">Không tìm thấy người dùng</div>';
  return;
 }

 users.forEach(u=>{

  const div=document.createElement("div");
  div.className="item";

  const left=document.createElement("div");
  left.className="left";

  left.innerHTML=
   '<div class="avatar">'+
   u.username[0].toUpperCase()+
   '</div><div class="name">'+
   u.username+
   '</div>';

  const b=document.createElement("button");
  b.className="btn "+(u.friend?"":"green");

  if(u.friend){
   b.textContent="✅ Bạn bè";
   b.disabled=true;
  }else{
   b.textContent="➕ Kết bạn";
   b.onclick=()=>{
    ws.send(JSON.stringify({
     type:"friend-request",
     username:u.username
    }));
   };
  }

  div.append(left,b);
  box.appendChild(div);

 });

}


/* =========================
   LỜI MỜI
========================= */

function loadRequests(){

 ws.send(JSON.stringify({
  type:"get-friend-requests"
 }));

}


function renderRequests(list){

 const box=document.getElementById("requests");
 box.innerHTML="";

 if(!list.length){
  box.innerHTML='<div class="notice">Không có lời mời</div>';
  return;
 }

 list.forEach(r=>{

  const div=document.createElement("div");
  div.className="item";

  div.innerHTML=
   '<div class="left">'+
   '<div class="avatar">'+
   r.from[0].toUpperCase()+
   '</div>'+
   '<div class="name">'+r.from+'</div>'+
   '</div>';

  const actions=document.createElement("div");
  actions.className="actions";

  const yes=document.createElement("button");
  yes.className="green";
  yes.textContent="✅";
  yes.onclick=()=>{
   ws.send(JSON.stringify({
    type:"accept-friend",
    username:r.from
   }));
  };

  const no=document.createElement("button");
  no.className="red";
  no.textContent="❌";
  no.onclick=()=>{
   ws.send(JSON.stringify({
    type:"reject-friend",
    username:r.from
   }));
  };

  actions.append(yes,no);
  div.appendChild(actions);
  box.appendChild(div);

 });

}


/* =========================
   BẠN BÈ
========================= */

function loadFriends(){

 ws.send(JSON.stringify({
  type:"friend-list"
 }));

}


function renderFriends(list){

 const box=document.getElementById("friends");
 box.innerHTML="";

 if(!list.length){
  box.innerHTML='<div class="notice">Chưa có bạn bè</div>';
  return;
 }

 list.forEach(f=>{

  const div=document.createElement("div");
  div.className="item";

  const left=document.createElement("div");
  left.className="left";

  left.innerHTML=
   '<div class="avatar">'+
   f.username[0].toUpperCase()+
   '</div>'+
   '<div>'+
   '<div class="name">'+f.username+'</div>'+
   '<div class="'+(f.online?"online":"offline")+'">'+
   (f.online?"● Online":"○ Offline")+
   '</div></div>';

  const actions=document.createElement("div");
  actions.className="actions";

  const chat=document.createElement("button");
  chat.className="blue";
  chat.textContent="💬";
  chat.onclick=()=>{
   openChat(f.username);
  };

  const call=document.createElement("button");
  call.className="green";
  call.textContent="📞";
  call.onclick=()=>{
   privateCall(f.username);
  };

  actions.append(chat,call);

  div.append(left,actions);
  box.appendChild(div);

 });

}


/* =========================
   CHAT RIÊNG
========================= */

function openChat(name){

 selected=name;

 document.getElementById("privateBox")
  .classList.remove("hidden");

 document.getElementById("chatTitle")
  .textContent="💬 "+name;

 document.getElementById("chat").innerHTML=
  '<div class="notice">Đang tải tin nhắn...</div>';

 ws.send(JSON.stringify({
  type:"load-private-chat",
  username:name
 }));

}


function closeChat(){

 selected="";

 document.getElementById("privateBox")
  .classList.add("hidden");

}


function sendChat(){

 if(!selected)return;

 const input=document.getElementById("chatInput");
 const text=input.value.trim();

 if(!text)return;

 ws.send(JSON.stringify({
  type:"private-chat",
  to:selected,
  text:text
 }));

 input.value="";

}


function addMessage(m){

 const box=document.getElementById("chat");

 if(box.textContent.includes("Đang tải")){
  box.innerHTML="";
 }

 const div=document.createElement("div");
 div.className="msg";

 if(m.from===username)
  div.classList.add("me");

 div.innerHTML=
  "<small>"+m.from+"</small>"+
  m.text;

 box.appendChild(div);
 box.scrollTop=box.scrollHeight;

}


/* =========================
   GỌI
========================= */

function joinRoom(){

 const r=document.getElementById("room").value.trim();

 if(!r){
  alert("Nhập tên phòng");
  return;
 }

 room=r;

 ws.send(JSON.stringify({
  type:"join",
  room:r
 }));

 document.getElementById("roomStatus")
  .textContent="🟢 Phòng: "+r;

}


function privateCall(friend){

 const names=[username,friend].sort();

 const r="private-call-"+names.join("-");

 document.getElementById("room").value=r;

 joinRoom();

 setTimeout(call,500);

}


/* =========================
   WEBRTC
========================= */

const rtcConfig={
 iceServers:[
  {urls:"stun:stun.l.google.com:19302"}
 ]
};


async function call(){

 if(!room){
  alert("Vào phòng trước");
  return;
 }

 try{

  stream=await navigator.mediaDevices.getUserMedia({
   audio:true,
   video:false
  });

  await makePeer();

  const offer=await peer.createOffer();

  await peer.setLocalDescription(offer);

  ws.send(JSON.stringify({
   type:"offer",
   offer:offer
  }));

  document.getElementById("callStatus")
   .textContent="📞 Đang gọi...";

 }catch(e){

  alert("Không bật được microphone");

 }

}


async function makePeer(){

 if(peer)peer.close();

 peer=new RTCPeerConnection(rtcConfig);

 if(stream){
  stream.getTracks().forEach(t=>{
   peer.addTrack(t,stream);
  });
 }

 peer.onicecandidate=e=>{
  if(e.candidate){
   ws.send(JSON.stringify({
    type:"ice-candidate",
    candidate:e.candidate
   }));
  }
 };

 peer.ontrack=e=>{
  document.getElementById("audio").srcObject=e.streams[0];
 };

}


async function rtc(d){

 if(!peer)
  await makePeer();

 try{

  if(d.type==="offer"){

   await peer.setRemoteDescription(d.offer);

   const answer=await peer.createAnswer();

   await peer.setLocalDescription(answer);

   ws.send(JSON.stringify({
    type:"answer",
    answer:answer
   }));

  }

  if(d.type==="answer"){
   await peer.setRemoteDescription(d.answer);
  }

  if(d.type==="ice-candidate"){
   if(d.candidate)
    await peer.addIceCandidate(d.candidate);
  }

 }catch(e){
  console.log(e);
 }

}


/* =========================
   MIC
========================= */

function mic(){

 if(!stream){
  alert("Bạn chưa gọi");
  return;
 }

 const t=stream.getAudioTracks()[0];

 if(t){
  t.enabled=!t.enabled;
  alert(t.enabled?"🎤 Mic bật":"🔇 Mic tắt");
 }

}


/* =========================
   CÚP
========================= */

function hangup(){

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }

 closePeer();

 document.getElementById("audio").srcObject=null;

 document.getElementById("callStatus")
  .textContent="Đã kết thúc";

}


function closePeer(){

 if(peer){
  peer.close();
  peer=null;
 }

}


/* =========================
   ĐĂNG XUẤT
========================= */

function logout(){

 localStorage.removeItem("wifiSession");

 if(ws && ws.readyState===WebSocket.OPEN){
  ws.send(JSON.stringify({type:"logout"}));
 }

 username="";
 showLogin();

}


/* =========================
   KHỞI ĐỘNG
========================= */

async function start(){

 try{
  await connect();
  autoLogin();
 }catch{
  showLogin();
  document.getElementById("loginStatus")
   .textContent="Không kết nối được máy chủ";
 }

}

start();

</script>
</body>
</html>
