<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Call</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#eef2f7;
  height:100vh;
  overflow:hidden
}

.page{
  display:none;
  width:100%;
  height:100vh
}

.page.active{
  display:flex
}

/* AUTH */

.auth{
  justify-content:center;
  align-items:center;
  padding:20px
}

.box{
  width:100%;
  max-width:380px;
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 8px 30px #0002
}

.box h1{
  text-align:center;
  margin-bottom:20px
}

.box input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none
}

.box button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#1683ff;
  color:white;
  font-size:16px
}

.link{
  text-align:center;
  margin-top:16px;
  color:#1683ff;
  cursor:pointer
}

.status{
  text-align:center;
  margin-top:12px;
  min-height:20px
}

/* HOME */

.home{
  flex-direction:column
}

.header{
  height:62px;
  background:#1683ff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px
}

.header h2{
  font-size:21px
}

.header button{
  border:0;
  background:#ffffff25;
  color:white;
  padding:9px 12px;
  border-radius:10px
}

.content{
  flex:1;
  display:flex;
  min-height:0
}

/* SIDEBAR */

.sidebar{
  width:30%;
  min-width:120px;
  background:white;
  border-right:1px solid #ddd
}

.sidebar-title{
  padding:16px;
  font-weight:bold
}

.chat-user{
  padding:14px;
  border-top:1px solid #eee;
  cursor:pointer
}

/* CHAT */

.chat{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column
}

.chat-top{
  padding:14px;
  background:white;
  border-bottom:1px solid #ddd;
  font-weight:bold
}

.messages{
  flex:1;
  padding:15px;
  overflow-y:auto
}

.message{
  width:max-content;
  max-width:75%;
  padding:10px 13px;
  margin:7px 0;
  border-radius:16px;
  background:white;
  box-shadow:0 1px 3px #0001;
  word-break:break-word
}

.message.me{
  margin-left:auto;
  background:#1683ff;
  color:white
}

.message-name{
  font-size:11px;
  opacity:.7;
  margin-bottom:3px
}

.chat-input{
  display:flex;
  gap:8px;
  padding:10px;
  background:white
}

.chat-input input{
  flex:1;
  min-width:0;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none
}

.chat-input button{
  width:55px;
  border:0;
  border-radius:12px;
  background:#1683ff;
  color:white;
  font-size:20px
}

/* CALL */

.call-panel{
  display:flex;
  gap:7px;
  padding:10px;
  background:white;
  border-top:1px solid #ddd
}

.call-panel input{
  flex:1;
  min-width:0;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px
}

.call-panel button{
  border:0;
  border-radius:10px;
  padding:10px 12px
}

.call{
  background:#18a957;
  color:white
}

.hang{
  background:#e53935;
  color:white
}

.mic{
  background:#555;
  color:white
}

#callStatus{
  padding:6px 12px;
  font-size:13px;
  background:white;
  color:#555
}

audio{
  display:none
}

@media(max-width:600px){

  .sidebar{
    width:100px;
    min-width:100px
  }

  .header h2{
    font-size:18px
  }

  .call-panel{
    flex-wrap:wrap
  }

  .call-panel input{
    width:100%;
    flex-basis:100%
  }

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="page auth active">

  <div class="box">

    <h1>💬 WiFi Call</h1>

    <input
      id="loginUser"
      placeholder="Tên đăng nhập">

    <input
      id="loginPass"
      type="password"
      placeholder="Mật khẩu">

    <button onclick="login()">
      Đăng nhập
    </button>

    <div
      id="loginStatus"
      class="status">
    </div>

    <div
      class="link"
      onclick="showRegister()">
      Chưa có tài khoản? Đăng ký
    </div>

  </div>

</div>


<!-- ================= REGISTER ================= -->

<div id="registerPage" class="page auth">

  <div class="box">

    <h1>📝 Đăng ký</h1>

    <input
      id="registerUser"
      placeholder="Tên đăng nhập">

    <input
      id="registerPass"
      type="password"
      placeholder="Mật khẩu">

    <button onclick="register()">
      Đăng ký
    </button>

    <div
      id="registerStatus"
      class="status">
    </div>

    <div
      class="link"
      onclick="showLogin()">
      Đã có tài khoản? Đăng nhập
    </div>

  </div>

</div>


<!-- ================= HOME ================= -->

<div id="homePage" class="page home">

  <div class="header">

    <h2>💬 WiFi Call</h2>

    <button onclick="logout()">
      Đăng xuất
    </button>

  </div>


  <div class="content">

    <!-- DANH SÁCH CHAT -->

    <div class="sidebar">

      <div class="sidebar-title">
        Tin nhắn
      </div>

      <div class="chat-user">
        👥 Phòng chat
      </div>

    </div>


    <!-- CHAT -->

    <div class="chat">

      <div class="chat-top">
        💬 Phòng chat
      </div>

      <div
        id="messages"
        class="messages">
      </div>


      <div class="chat-input">

        <input
          id="messageInput"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
          onkeydown="
            if(event.key==='Enter'){
              sendMessage()
            }
          ">

        <button onclick="sendMessage()">
          ➤
        </button>

      </div>


      <!-- TRẠNG THÁI GỌI -->

      <div id="callStatus">
        Chưa gọi
      </div>


      <!-- GỌI -->

      <div class="call-panel">

        <input
          id="roomInput"
          placeholder="Tên phòng, ví dụ: 123">

        <button
          class="call"
          onclick="joinCall()">
          📞 Gọi
        </button>

        <button
          class="mic"
          onclick="toggleMic()">
          🎙️
        </button>

        <button
          class="hang"
          onclick="hangup()">
          ✖
        </button>

      </div>

    </div>

  </div>

</div>


<audio id="remoteAudio" autoplay></audio>


<script>

/* ==================================================
   CẤU HÌNH
================================================== */

const SERVER =
  "https://wifi-call-server-1.onrender.com";


let socket = null;

let username = "";

let currentRoom = "";

let pc = null;

let localStream = null;

let micEnabled = true;

let connectedToCall = false;


/* ==================================================
   HIỂN THỊ TRANG
================================================== */

function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");
}


function showLogin(){

  document
    .getElementById("loginStatus")
    .textContent = "";

  showPage("loginPage");
}


function showRegister(){

  document
    .getElementById("registerStatus")
    .textContent = "";

  showPage("registerPage");
}


function showHome(){

  showPage("homePage");

  document
    .getElementById("callStatus")
    .textContent =
      "Đã đăng nhập: " + username;
}


/* ==================================================
   WEBSOCKET
================================================== */

function connect(){

  const wsURL =
    SERVER.replace(
      /^http/,
      "ws"
    );

  socket =
    new WebSocket(wsURL);


  socket.onopen = () => {

    console.log(
      "WebSocket connected"
    );

  };


  socket.onmessage =
    async event => {

      let data;

      try{

        data =
          JSON.parse(
            event.data
          );

      }catch{

        return;

      }


      /* ĐĂNG KÝ */

      if(
        data.type ===
        "register-result"
      ){

        const status =
          document.getElementById(
            "registerStatus"
          );

        status.textContent =
          data.message;

        if(data.success){

          document
            .getElementById(
              "registerUser"
            )
            .value = "";

          document
            .getElementById(
              "registerPass"
            )
            .value = "";

          setTimeout(
            showLogin,
            1000
          );

        }

        return;
      }


      /* ĐĂNG NHẬP */

      if(
        data.type ===
        "login-result"
      ){

        const status =
          document.getElementById(
            "loginStatus"
          );


        if(data.success){

          username =
            data.username;

          status.textContent =
            "";

          showHome();

        }else{

          status.textContent =
            data.message;

        }

        return;
      }


      /* CHAT */

      if(
        data.type ===
        "chat"
      ){

        addMessage(
          data.message
        );

        return;
      }


      /* NGƯỜI KHÁC VÀO PHÒNG */

      if(
        data.type ===
        "peer-joined"
      ){

        document
          .getElementById(
            "callStatus"
          )
          .textContent =
            "📞 Người khác đã vào phòng";

        /*
          Người vào trước tạo offer.
        */

        if(
          pc &&
          pc.signalingState ===
          "stable"
        ){

          await createOffer();

        }

        return;
      }


      /* NGƯỜI KHÁC RỜI */

      if(
        data.type ===
        "peer-left"
      ){

        document
          .getElementById(
            "callStatus"
          )
          .textContent =
            "Người kia đã rời cuộc gọi";

        return;
      }


      /* WEBRTC */

      await handleWebRTC(data);

    };


  socket.onclose = () => {

    console.log(
      "WebSocket disconnected"
    );

  };


  socket.onerror = () => {

    console.log(
      "WebSocket error"
    );

  };

}


/* ==================================================
   ĐĂNG KÝ
================================================== */

function register(){

  const user =
    document
      .getElementById(
        "registerUser"
      )
      .value
      .trim();

  const pass =
    document
      .getElementById(
        "registerPass"
      )
      .value;


  if(!user || !pass){

    document
      .getElementById(
        "registerStatus"
      )
      .textContent =
        "Vui lòng nhập đầy đủ";

    return;
  }


  if(!socket ||
     socket.readyState !==
     WebSocket.OPEN){

    document
      .getElementById(
        "registerStatus"
      )
      .textContent =
        "Đang kết nối server...";

    connect();

    setTimeout(
      register,
      1000
    );

    return;
  }


  socket.send(
    JSON.stringify({

      type:
        "register",

      username:
        user,

      password:
        pass

    })
  );


  document
    .getElementById(
      "registerStatus"
    )
    .textContent =
      "Đang đăng ký...";

}


/* ==================================================
   ĐĂNG NHẬP
================================================== */

function login(){

  const user =
    document
      .getElementById(
        "loginUser"
      )
      .value
      .trim();

  const pass =
    document
      .getElementById(
        "loginPass"
      )
      .value;


  if(!user || !pass){

    document
      .getElementById(
        "loginStatus"
      )
      .textContent =
        "Vui lòng nhập đầy đủ";

    return;
  }


  if(!socket ||
     socket.readyState !==
     WebSocket.OPEN){

    document
      .getElementById(
        "loginStatus"
      )
      .textContent =
      "Đang kết nối server...";

    connect();

    setTimeout(
      login,
      1000
    );

    return;
  }


  socket.send(
    JSON.stringify({

      type:
        "login",

      username:
        user,

      password:
        pass

    })
  );


  document
    .getElementById(
      "loginStatus"
    )
    .textContent =
      "Đang đăng nhập...";

}


/* ==================================================
   CHAT
================================================== */

function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();


  if(!text) return;


  if(
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ){

    alert(
      "Chưa kết nối server"
    );

    return;
  }


  if(!currentRoom){

    alert(
      "Hãy vào phòng trước"
    );

    return;
  }


  socket.send(
    JSON.stringify({

      type:
        "chat",

      text:
        text

    })
  );


  input.value = "";

  input.focus();

}


function addMessage(message){

  const box =
    document.getElementById(
      "messages"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message" +
    (
      message.from === username
        ? " me"
        : ""
    );


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "message-name";

  name.textContent =
    message.from;


  const text =
    document.createElement(
      "div"
    );

  text.textContent =
    message.text;


  div.appendChild(name);

  div.appendChild(text);

  box.appendChild(div);


  box.scrollTop =
    box.scrollHeight;

}


/* ==================================================
   VÀO PHÒNG GỌI + CHAT
================================================== */

async function joinCall(){

  const room =
    document
      .getElementById(
        "roomInput"
      )
      .value
      .trim();


  if(!room){

    alert(
      "Nhập tên phòng"
    );

    return;
  }


  if(
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ){

    alert(
      "Chưa kết nối server"
    );

    return;
  }


  currentRoom =
    room;


  document
    .getElementById(
      "callStatus"
    )
    .textContent =
      "Đang vào phòng " +
      room;


  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true,
          video:false
        });


    createPeerConnection();


    socket.send(
      JSON.stringify({

        type:
          "join",

        room:
          room

      })
    );


    connectedToCall =
      true;


    document
      .getElementById(
        "callStatus"
      )
      .textContent =
        "🟢 Đã vào phòng " +
        room;

  }catch(error){

    console.error(error);

    document
      .getElementById(
        "callStatus"
      )
      .textContent =
        "Không lấy được microphone";

  }

}


/* ==================================================
   WEBRTC
================================================== */

function createPeerConnection(){

  pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  pc.onicecandidate =
    event => {

      if(
        event.candidate &&
        socket &&
        socket.readyState ===
        WebSocket.OPEN
      ){

        socket.send(
          JSON.stringify({

            type:
              "candidate",

            candidate:
              event.candidate

          })
        );

      }

    };


  pc.ontrack =
    event => {

      const audio =
        document.getElementById(
          "remoteAudio"
        );

      audio.srcObject =
        event.streams[0];

      audio.play()
        .catch(
          () => {}
        );

    };


  pc.onconnectionstatechange =
    () => {

      if(
        pc.connectionState ===
        "connected"
      ){

        document
          .getElementById(
            "callStatus"
          )
          .textContent =
            "🟢 Đang gọi";

      }

      if(
        pc.connectionState ===
        "disconnected" ||
        pc.connectionState ===
        "failed"
      ){

        document
          .getElementById(
            "callStatus"
          )
          .textContent =
            "Cuộc gọi bị ngắt";

      }

    };

}


async function createOffer(){

  if(!pc) return;


  try{

    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    socket.send(
      JSON.stringify({

        type:
          "offer",

        offer:
          pc.localDescription

      })
    );

  }catch(error){

    console.error(error);

  }

}


async function handleWebRTC(data){

  if(
    data.type !== "offer" &&
    data.type !== "answer" &&
    data.type !== "candidate"
  ){

    return;
  }


  if(!pc){

    createPeerConnection();

  }


  try{

    if(
      data.type ===
      "offer"
    ){

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      socket.send(
        JSON.stringify({

          type:
            "answer",

          answer:
            pc.localDescription

        })
      );

      return;
    }


    if(
      data.type ===
      "answer"
    ){

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

      return;
    }


    if(
      data.type ===
      "candidate"
    ){

      await pc.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    }

  }catch(error){

    console.error(
      "WebRTC error:",
      error
    );

  }

}


/* ==================================================
   MIC
================================================== */

function toggleMic(){

  if(!localStream){

    return;
  }


  micEnabled =
    !micEnabled;


  localStream
    .getAudioTracks()
    .forEach(
      track =>
        track.enabled =
          micEnabled
    );


  document
    .getElementById(
      "callStatus"
    )
    .textContent =
      micEnabled
        ? "🎙️ Micro đã bật"
        : "🔇 Micro đã tắt";

}


/* ==================================================
   KẾT THÚC CUỘC GỌI
================================================== */

function hangup(){

  if(pc){

    pc.close();

    pc = null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream =
      null;

  }


  currentRoom =
    "";


  connectedToCall =
    false;


  document
    .getElementById(
      "callStatus"
    )
    .textContent =
      "Đã kết thúc cuộc gọi";

}


/* ==================================================
   ĐĂNG XUẤT
================================================== */

function logout(){

  hangup();

  username =
    "";

  currentRoom =
    "";

  document
    .getElementById(
      "messages"
    )
    .innerHTML =
      "";

  showLogin();

}


/* ==================================================
   KHỞI ĐỘNG
================================================== */

connect();

</script>

</body>
  </html>
