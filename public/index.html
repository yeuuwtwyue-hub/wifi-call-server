<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Call</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0f172a;color:white}
.hidden{display:none!important}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.card{
  width:100%;
  max-width:430px;
  background:#1e293b;
  padding:25px;
  border-radius:20px
}

.logo{text-align:center;font-size:30px;font-weight:bold}
.sub{text-align:center;color:#94a3b8;margin:10px 0 20px}

input{
  width:100%;
  padding:14px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #475569;
  background:#0f172a;
  color:white;
  outline:none
}

button{
  border:0;
  border-radius:12px;
  padding:13px;
  cursor:pointer;
  color:white;
  font-weight:bold
}

.main{
  width:100%;
  background:#2563eb;
  margin-top:10px
}

.secondary{
  width:100%;
  background:#475569;
  margin-top:8px
}

.status{
  text-align:center;
  margin-top:12px;
  min-height:20px;
  color:#fbbf24
}

#appPage{min-height:100vh}

.header{
  background:#1e293b;
  padding:15px;
  display:flex;
  justify-content:space-between;
  position:sticky;
  top:0
}

.title{font-size:22px;font-weight:bold}
.user{color:#38bdf8;font-size:13px}

.content{
  max-width:600px;
  margin:auto;
  padding:15px
}

.section{
  background:#1e293b;
  padding:15px;
  border-radius:16px;
  margin-bottom:15px
}

.section h3{margin-bottom:12px}

.row{
  display:flex;
  gap:8px
}

.row input{margin:0}

.row button{
  width:100px;
  background:#2563eb
}

.info{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  padding-top:8px
}

.chat{
  height:300px;
  overflow-y:auto;
  background:#0f172a;
  padding:10px;
  border-radius:12px
}

.msg{
  background:#334155;
  padding:9px;
  border-radius:12px;
  margin-bottom:7px
}

.msg.me{
  background:#2563eb;
  margin-left:35px
}

.name{
  font-size:12px;
  color:#cbd5e1
}

.time{
  font-size:10px;
  color:#cbd5e1;
  margin-top:3px
}

.call-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.call-buttons button{
  flex:1;
  min-width:100px
}

.call{background:#22c55e}
.mic{background:#f59e0b}
.hang{background:#ef4444}
.logout{
  width:100%;
  background:#475569
}

#loading{
  position:fixed;
  inset:0;
  background:#0f172a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  font-size:19px
}
</style>
</head>

<body>

<div id="loading">
  🔄 Đang kết nối máy chủ...
</div>

<!-- LOGIN -->
<div id="loginPage" class="auth hidden">
  <div class="card">

    <div class="logo">📞 WiFi Call</div>
    <div class="sub">Đăng nhập</div>

    <input id="loginUser"
           placeholder="Tên đăng nhập"
           autocomplete="username">

    <input id="loginPass"
           type="password"
           placeholder="Mật khẩu"
           autocomplete="current-password">

    <button class="main" onclick="login()">
      Đăng nhập
    </button>

    <button class="secondary" onclick="showRegister()">
      Tạo tài khoản
    </button>

    <div id="loginStatus" class="status"></div>

  </div>
</div>

<!-- REGISTER -->
<div id="registerPage" class="auth hidden">
  <div class="card">

    <div class="logo">📝 Đăng ký</div>
    <div class="sub">Tạo tài khoản</div>

    <input id="registerUser"
           placeholder="Tên đăng nhập">

    <input id="registerPass"
           type="password"
           placeholder="Mật khẩu">

    <button class="main" onclick="register()">
      Đăng ký
    </button>

    <button class="secondary" onclick="showLogin()">
      Quay lại
    </button>

    <div id="registerStatus" class="status"></div>

  </div>
</div>

<!-- APP -->
<div id="appPage" class="hidden">

  <div class="header">
    <div>
      <div class="title">📞 WiFi Call</div>
      <div id="currentUser" class="user"></div>
    </div>
  </div>

  <div class="content">

    <div class="section">

      <h3>🏠 Phòng</h3>

      <div class="row">

        <input id="room"
               placeholder="Tên phòng">

        <button onclick="joinRoom()">
          Vào
        </button>

      </div>

      <div id="roomInfo" class="info">
        Chưa vào phòng
      </div>

    </div>

    <div class="section">

      <h3>💬 Chat</h3>

      <div id="chat" class="chat"></div>

      <div class="row" style="margin-top:8px">

        <input id="message"
               placeholder="Tin nhắn..."
               onkeydown="if(event.key==='Enter')sendMessage()">

        <button
          style="background:#22c55e"
          onclick="sendMessage()">
          Gửi
        </button>

      </div>

    </div>

    <div class="section">

      <h3>📞 Gọi</h3>

      <div class="call-buttons">

        <button class="call"
                onclick="startCall()">
          📞 Gọi
        </button>

        <button id="mic"
                class="mic"
                onclick="toggleMic()">
          🎤 Mic
        </button>

        <button class="hang"
                onclick="hangup()">
          ❌ Cúp
        </button>

      </div>

      <div id="callInfo" class="info">
        Chưa gọi
      </div>

    </div>

    <div class="section">

      <button class="logout"
              onclick="logout()">
        🚪 Đăng xuất
      </button>

    </div>

  </div>

</div>

<audio id="remote" autoplay></audio>

<script>

const SERVER =
"https://wifi-call-server-1.onrender.com";

let ws=null;
let username="";
let currentRoom="";
let localStream=null;
let peer=null;


/* =========================
   HIỂN THỊ
========================= */

function hideLoading(){
  document.getElementById("loading")
    .classList.add("hidden");
}

function showLogin(){

  hideLoading();

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("registerPage")
    .classList.add("hidden");

  document.getElementById("appPage")
    .classList.add("hidden");

}

function showRegister(){

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("registerPage")
    .classList.remove("hidden");

  document.getElementById("appPage")
    .classList.add("hidden");

}

function showApp(){

  hideLoading();

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("registerPage")
    .classList.add("hidden");

  document.getElementById("appPage")
    .classList.remove("hidden");

  document.getElementById("currentUser")
    .textContent="👤 "+username;

}


/* =========================
   KẾT NỐI
========================= */

function connect(){

  return new Promise((resolve,reject)=>{

    const url =
      SERVER.replace(/^http/,"ws");

    ws=new WebSocket(url);

    let finished=false;

    const timer=setTimeout(()=>{

      if(finished)return;

      finished=true;

      reject(
        new Error("Timeout")
      );

    },8000);

    ws.onopen=()=>{

      if(finished)return;

      finished=true;

      clearTimeout(timer);

      resolve();

    };

    ws.onerror=()=>{

      if(finished)return;

      finished=true;

      clearTimeout(timer);

      reject(
        new Error("WebSocket error")
      );

    };

    ws.onclose=()=>{

      document.getElementById("roomInfo")
        .textContent=
        "🔴 Mất kết nối máy chủ";

    };

    ws.onmessage=e=>{

      let data;

      try{
        data=JSON.parse(e.data);
      }catch{
        return;
      }

      handle(data);

    };

  });

}


/* =========================
   XỬ LÝ SERVER
========================= */

function handle(data){

  /* LOGIN */

  if(data.type==="login-result"){

    if(!data.success){

      document.getElementById("loginStatus")
        .textContent=
        data.message ||
        "Sai tài khoản hoặc mật khẩu";

      return;

    }

    username=data.username;

    const user=
      document.getElementById("loginUser")
        .value.trim();

    const pass=
      document.getElementById("loginPass")
        .value;

    ws.send(JSON.stringify({

      type:"create-session",

      username:user,

      password:pass

    }));

    return;
  }


  /* SESSION */

  if(data.type==="session-created"){

    if(data.success){

      localStorage.setItem(
        "wifiCallSession",
        JSON.stringify({
          username:data.username,
          token:data.token
        })
      );

      username=data.username;

      showApp();

    }

    return;
  }


  /* AUTO LOGIN */

  if(data.type==="session-result"){

    if(data.success){

      username=data.username;

      showApp();

    }
    else{

      localStorage.removeItem(
        "wifiCallSession"
      );

      showLogin();

    }

    return;
  }


  /* REGISTER */

  if(data.type==="register-result"){

    document.getElementById(
      "registerStatus"
    ).textContent=
      data.message || "";

    if(data.success){

      setTimeout(()=>{

        showLogin();

      },700);

    }

    return;
  }


  /* LOGOUT */

  if(data.type==="logout-result"){

    localStorage.removeItem(
      "wifiCallSession"
    );

    username="";

    showLogin();

    return;
  }


  /* CHAT */

  if(data.type==="chat"){

    addMessage(data.message);

    return;
  }


  /* CALL */

  if(data.type==="peer-joined"){

    document.getElementById("callInfo")
      .textContent=
      "👤 Có người vào phòng";

    return;
  }

  if(data.type==="peer-left"){

    closePeer();

    document.getElementById("callInfo")
      .textContent=
      "👤 Người kia đã rời phòng";

    return;
  }


  if(
    data.type==="offer" ||
    data.type==="answer" ||
    data.type==="ice-candidate"
  ){

    handleRTC(data);

  }

}


/* =========================
   ĐĂNG KÝ
========================= */

function register(){

  const user=
    document.getElementById("registerUser")
      .value.trim();

  const pass=
    document.getElementById("registerPass")
      .value;

  if(!user||!pass){

    document.getElementById(
      "registerStatus"
    ).textContent=
      "Nhập đầy đủ thông tin";

    return;
  }

  ws.send(JSON.stringify({

    type:"register",

    username:user,

    password:pass

  }));

}


/* =========================
   ĐĂNG NHẬP
========================= */

function login(){

  const user=
    document.getElementById("loginUser")
      .value.trim();

  const pass=
    document.getElementById("loginPass")
      .value;

  if(!user||!pass){

    document.getElementById(
      "loginStatus"
    ).textContent=
      "Nhập tài khoản và mật khẩu";

    return;
  }

  document.getElementById(
    "loginStatus"
  ).textContent=
    "Đang đăng nhập...";

  ws.send(JSON.stringify({

    type:"login",

    username:user,

    password:pass

  }));

}


/* =========================
   TỰ ĐĂNG NHẬP
========================= */

function autoLogin(){

  const saved=
    localStorage.getItem(
      "wifiCallSession"
    );

  if(!saved){

    showLogin();

    return;

  }

  let session;

  try{

    session=JSON.parse(saved);

  }catch{

    localStorage.removeItem(
      "wifiCallSession"
    );

    showLogin();

    return;

  }

  if(
    !session.username ||
    !session.token
  ){

    localStorage.removeItem(
      "wifiCallSession"
    );

    showLogin();

    return;

  }

  ws.send(JSON.stringify({

    type:"session-login",

    username:session.username,

    token:session.token

  }));

}


/* =========================
   PHÒNG
========================= */

function joinRoom(){

  const room=
    document.getElementById("room")
      .value.trim();

  if(!room){

    alert("Nhập tên phòng");

    return;

  }

  currentRoom=room;

  ws.send(JSON.stringify({

    type:"join",

    room:room

  }));

  document.getElementById("roomInfo")
    .textContent=
    "🟢 Phòng: "+room;

}


/* =========================
   CHAT
========================= */

function sendMessage(){

  const input=
    document.getElementById("message");

  const text=input.value.trim();

  if(!text)return;

  if(!currentRoom){

    alert("Vào phòng trước");

    return;

  }

  ws.send(JSON.stringify({

    type:"chat",

    text:text

  }));

  input.value="";

}


function addMessage(m){

  const div=
    document.createElement("div");

  div.className="msg";

  if(m.from===username)
    div.classList.add("me");

  const name=
    document.createElement("div");

  name.className="name";

  name.textContent=m.from;

  const text=
    document.createElement("div");

  text.textContent=m.text;

  const time=
    document.createElement("div");

  time.className="time";

  time.textContent=
    new Date(m.time)
      .toLocaleTimeString(
        "vi-VN",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  div.append(
    name,
    text,
    time
  );

  const chat=
    document.getElementById("chat");

  chat.appendChild(div);

  chat.scrollTop=
    chat.scrollHeight;

}


/* =========================
   WEBRTC
========================= */

const rtcConfig={
  iceServers:[
    {
      urls:
      "stun:stun.l.google.com:19302"
    }
  ]
};


async function startCall(){

  if(!currentRoom){

    alert("Vào phòng trước");

    return;

  }

  try{

    localStream=
      await navigator.mediaDevices
        .getUserMedia({
          audio:true,
          video:false
        });

    await createPeer();

    const offer=
      await peer.createOffer();

    await peer.setLocalDescription(
      offer
    );

    ws.send(JSON.stringify({

      type:"offer",

      offer:offer

    }));

    document.getElementById("callInfo")
      .textContent=
      "📞 Đang gọi...";

  }
  catch(e){

    console.error(e);

    alert(
      "Không thể sử dụng microphone"
    );

  }

}


async function createPeer(){

  if(peer)peer.close();

  peer=
    new RTCPeerConnection(
      rtcConfig
    );

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{

        peer.addTrack(
          track,
          localStream
        );

      });

  }

  peer.onicecandidate=e=>{

    if(e.candidate){

      ws.send(JSON.stringify({

        type:"ice-candidate",

        candidate:e.candidate

      }));

    }

  };

  peer.ontrack=e=>{

    const audio=
      document.getElementById("remote");

    audio.srcObject=
      e.streams[0];

    audio.play().catch(()=>{});

    document.getElementById("callInfo")
      .textContent=
      "🟢 Đang gọi";

  };

}


async function handleRTC(data){

  try{

    if(!peer)
      await createPeer();

    if(data.type==="offer"){

      await peer.setRemoteDescription(
        data.offer
      );

      const answer=
        await peer.createAnswer();

      await peer.setLocalDescription(
        answer
      );

      ws.send(JSON.stringify({

        type:"answer",

        answer:answer

      }));

    }

    if(data.type==="answer"){

      await peer.setRemoteDescription(
        data.answer
      );

    }

    if(data.type==="ice-candidate"){

      if(data.candidate){

        await peer.addIceCandidate(
          data.candidate
        );

      }

    }

  }
  catch(e){

    console.error(e);

  }

}


/* =========================
   MIC
========================= */

function toggleMic(){

  if(!localStream){

    alert("Chưa gọi");

    return;

  }

  const track=
    localStream.getAudioTracks()[0];

  if(!track)return;

  track.enabled=
    !track.enabled;

  document.getElementById("mic")
    .textContent=
      track.enabled
      ? "🎤 Mic"
      : "🔇 Mic tắt";

}


/* =========================
   CÚP MÁY
========================= */

function hangup(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(t=>t.stop());

    localStream=null;

  }

  closePeer();

  document.getElementById("remote")
    .srcObject=null;

  document.getElementById("callInfo")
    .textContent=
    "Đã kết thúc";

}


function closePeer(){

  if(peer){

    peer.close();

    peer=null;

  }

}


/* =========================
   ĐĂNG XUẤT
========================= */

function logout(){

  localStorage.removeItem(
    "wifiCallSession"
  );

  if(ws &&
     ws.readyState===WebSocket.OPEN){

    ws.send(JSON.stringify({
      type:"logout"
    }));

  }
  else{

    showLogin();

  }

}


/* =========================
   CHẠY APP
========================= */

async function start(){

  try{

    await connect();

    autoLogin();

  }
  catch(e){

    /*
     * Không để app treo mãi.
     */

    showLogin();

    document.getElementById(
      "loginStatus"
    ).textContent=
      "Máy chủ đang khởi động, bạn có thể thử lại.";

  }

}

start();

</script>

</body>
  </html>
