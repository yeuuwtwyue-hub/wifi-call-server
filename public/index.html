<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WiFi Call</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  min-height:100vh;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:20px;
}

/* LOGIN */
.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:100%;
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 40px #0006;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #475569;
  border-radius:12px;
  background:#0f172a;
  color:white;
  outline:none;
}

input:focus{
  border-color:#38bdf8;
}

.main-btn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.secondary-btn{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  background:#334155;
  color:white;
}

.status{
  text-align:center;
  margin-top:12px;
  color:#fbbf24;
  min-height:20px;
}

/* APP */
.app{
  min-height:100vh;
}

.header{
  background:#1e293b;
  padding:15px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.header-title{
  font-size:22px;
  font-weight:bold;
}

.user{
  color:#38bdf8;
  font-size:14px;
}

.content{
  padding:18px;
  max-width:600px;
  margin:auto;
}

.section{
  background:#1e293b;
  padding:16px;
  border-radius:16px;
  margin-bottom:15px;
}

.section h3{
  margin-bottom:12px;
}

.room-row{
  display:flex;
  gap:8px;
}

.room-row input{
  margin:0;
}

.room-row button{
  width:100px;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

.chat-box{
  height:300px;
  overflow-y:auto;
  background:#0f172a;
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
}

.message{
  background:#334155;
  padding:9px 12px;
  border-radius:12px;
  margin-bottom:7px;
  word-break:break-word;
}

.message.me{
  background:#2563eb;
  margin-left:35px;
}

.message-name{
  font-size:12px;
  color:#cbd5e1;
  margin-bottom:3px;
}

.message-time{
  font-size:10px;
  color:#cbd5e1;
  margin-top:3px;
}

.chat-row{
  display:flex;
  gap:8px;
}

.chat-row input{
  margin:0;
}

.chat-row button{
  width:80px;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:bold;
}

.call-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.call-btn{
  flex:1;
  min-width:120px;
  padding:13px;
  border-radius:12px;
  color:white;
  font-weight:bold;
}

.call{
  background:#22c55e;
}

.mic{
  background:#f59e0b;
}

.hangup{
  background:#ef4444;
}

.logout{
  width:100%;
  padding:13px;
  background:#475569;
  color:white;
  border-radius:12px;
  font-weight:bold;
}

.connection{
  text-align:center;
  padding:8px;
  color:#94a3b8;
  font-size:13px;
}

.loading{
  position:fixed;
  inset:0;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  font-size:20px;
}
</style>
</head>

<body>

<div id="loading" class="loading">
  Đang kiểm tra đăng nhập...
</div>

<!-- LOGIN -->
<div id="loginPage" class="auth hidden">
  <div class="container">
    <div class="card">

      <div class="logo">📞 WiFi Call</div>
      <div class="subtitle">Đăng nhập tài khoản</div>

      <input id="loginUsername"
             type="text"
             placeholder="Tên đăng nhập"
             autocomplete="username">

      <input id="loginPassword"
             type="password"
             placeholder="Mật khẩu"
             autocomplete="current-password">

      <button class="main-btn" onclick="login()">
        Đăng nhập
      </button>

      <button class="secondary-btn" onclick="showRegister()">
        Tạo tài khoản
      </button>

      <div id="loginStatus" class="status"></div>

    </div>
  </div>
</div>

<!-- REGISTER -->
<div id="registerPage" class="auth hidden">
  <div class="container">
    <div class="card">

      <div class="logo">📝 Đăng ký</div>
      <div class="subtitle">Tạo tài khoản WiFi Call</div>

      <input id="registerUsername"
             type="text"
             placeholder="Tên đăng nhập"
             autocomplete="username">

      <input id="registerPassword"
             type="password"
             placeholder="Mật khẩu"
             autocomplete="new-password">

      <button class="main-btn" onclick="register()">
        Đăng ký
      </button>

      <button class="secondary-btn" onclick="showLogin()">
        Quay lại đăng nhập
      </button>

      <div id="registerStatus" class="status"></div>

    </div>
  </div>
</div>

<!-- APP -->
<div id="appPage" class="app hidden">

  <div class="header">
    <div>
      <div class="header-title">📞 WiFi Call</div>
      <div id="currentUser" class="user"></div>
    </div>
  </div>

  <div class="content">

    <!-- ROOM -->
    <div class="section">

      <h3>🏠 Phòng gọi</h3>

      <div class="room-row">
        <input id="roomInput"
               type="text"
               placeholder="Nhập tên phòng">

        <button onclick="joinRoom()">
          Vào phòng
        </button>
      </div>

      <div id="roomStatus" class="connection">
        Chưa vào phòng
      </div>

    </div>

    <!-- CHAT -->
    <div class="section">

      <h3>💬 Chat</h3>

      <div id="chatBox" class="chat-box"></div>

      <div class="chat-row">
        <input id="messageInput"
               type="text"
               placeholder="Nhập tin nhắn..."
               onkeydown="if(event.key==='Enter')sendMessage()">

        <button onclick="sendMessage()">
          Gửi
        </button>
      </div>

    </div>

    <!-- CALL -->
    <div class="section">

      <h3>📞 Cuộc gọi</h3>

      <div class="call-controls">

        <button class="call-btn call"
                onclick="joinCall()">
          📞 Gọi
        </button>

        <button id="micBtn"
                class="call-btn mic"
                onclick="toggleMic()">
          🎤 Mic
        </button>

        <button class="call-btn hangup"
                onclick="hangup()">
          ❌ Cúp máy
        </button>

      </div>

      <div id="callStatus" class="connection">
        Chưa gọi
      </div>

    </div>

    <!-- ACCOUNT -->
    <div class="section">

      <button class="logout"
              onclick="logout()">
        🚪 Đăng xuất
      </button>

    </div>

  </div>

</div>

<audio id="remoteAudio" autoplay></audio>

<script>

/* =========================
   SERVER
========================= */

const SERVER = "https://wifi-call-server-1.onrender.com";

let ws = null;
let username = "";
let currentRoom = "";

let localStream = null;
let peerConnection = null;

let pendingSession = false;


/* =========================
   ELEMENTS
========================= */

const loading = document.getElementById("loading");
const loginPage = document.getElementById("loginPage");
const registerPage = document.getElementById("registerPage");
const appPage = document.getElementById("appPage");

const loginStatus = document.getElementById("loginStatus");
const registerStatus = document.getElementById("registerStatus");

const currentUser = document.getElementById("currentUser");
const roomStatus = document.getElementById("roomStatus");
const callStatus = document.getElementById("callStatus");

const chatBox = document.getElementById("chatBox");


/* =========================
   PAGE
========================= */

function showLogin(){

  loginPage.classList.remove("hidden");
  registerPage.classList.add("hidden");
  appPage.classList.add("hidden");

  loading.classList.add("hidden");

}

function showRegister(){

  loginPage.classList.add("hidden");
  registerPage.classList.remove("hidden");
  appPage.classList.add("hidden");

  registerStatus.textContent="";

}

function showHome(){

  loginPage.classList.add("hidden");
  registerPage.classList.add("hidden");
  appPage.classList.remove("hidden");

  loading.classList.add("hidden");

  currentUser.textContent =
    "👤 " + username;

}


/* =========================
   WEBSOCKET
========================= */

function connect(){

  return new Promise((resolve,reject)=>{

    const wsURL =
      SERVER.replace(/^http/,"ws");

    ws = new WebSocket(wsURL);

    ws.onopen = ()=>{

      console.log("WebSocket connected");

      roomStatus.textContent =
        "🟢 Đã kết nối máy chủ";

      resolve();

    };

    ws.onerror = ()=>{

      console.log("WebSocket error");

      reject();

    };

    ws.onclose = ()=>{

      roomStatus.textContent =
        "🔴 Mất kết nối máy chủ";

    };

    ws.onmessage = event =>{

      let data;

      try{
        data = JSON.parse(event.data);
      }
      catch{
        return;
      }

      handleMessage(data);

    };

  });

}


/* =========================
   MESSAGE HANDLER
========================= */

function handleMessage(data){

  /* LOGIN */

  if(data.type === "login-result"){

    if(data.success){

      username = data.username;

      loginStatus.textContent =
        "Đăng nhập thành công!";

      /*
       * Tạo session token.
       * Không lưu mật khẩu.
       */

      ws.send(JSON.stringify({

        type:"create-session",

        username:
          document.getElementById("loginUsername").value.trim(),

        password:
          document.getElementById("loginPassword").value

      }));

    }
    else{

      loginStatus.textContent =
        data.message || "Đăng nhập thất bại";

    }

    return;
  }


  /* SESSION CREATED */

  if(data.type === "session-created"){

    if(data.success){

      localStorage.setItem(
        "wifiCallSession",
        JSON.stringify({

          username:data.username,
          token:data.token

        })
      );

      username = data.username;

      showHome();

    }
    else{

      showHome();

    }

    return;
  }


  /* AUTO LOGIN */

  if(data.type === "session-result"){

    pendingSession = false;

    if(data.success){

      username = data.username;

      showHome();

    }
    else{

      localStorage.removeItem(
        "wifiCallSession"
      );

      showLogin();

    }

    return;
  }


  /* REGISTER */

  if(data.type === "register-result"){

    if(data.success){

      registerStatus.textContent =
        "Đăng ký thành công!";

      setTimeout(()=>{

        showLogin();

        document.getElementById(
          "loginUsername"
        ).value =
          document.getElementById(
            "registerUsername"
          ).value;

      },800);

    }
    else{

      registerStatus.textContent =
        data.message || "Đăng ký thất bại";

    }

    return;
  }


  /* LOGOUT */

  if(data.type === "logout-result"){

    localStorage.removeItem(
      "wifiCallSession"
    );

    username = "";

    showLogin();

    return;
  }


  /* CHAT */

  if(data.type === "chat"){

    addMessage(data.message);

    return;
  }


  /* WEBRTC */

  if(data.type === "peer-joined"){

    callStatus.textContent =
      "👤 Có người đã vào phòng";

    return;
  }

  if(data.type === "peer-left"){

    callStatus.textContent =
      "👤 Người kia đã rời phòng";

    closePeer();

    return;
  }


  if(
    data.type === "offer" ||
    data.type === "answer" ||
    data.type === "ice-candidate"
  ){

    handleWebRTC(data);

    return;
  }

}


/* =========================
   REGISTER
========================= */

function register(){

  const user =
    document.getElementById(
      "registerUsername"
    ).value.trim();

  const pass =
    document.getElementById(
      "registerPassword"
    ).value;

  registerStatus.textContent =
    "Đang đăng ký...";

  if(!user || !pass){

    registerStatus.textContent =
      "Vui lòng nhập đầy đủ";

    return;
  }

  ws.send(JSON.stringify({

    type:"register",

    username:user,

    password:pass

  }));

}


/* =========================
   LOGIN
========================= */

function login(){

  const user =
    document.getElementById(
      "loginUsername"
    ).value.trim();

  const pass =
    document.getElementById(
      "loginPassword"
    ).value;

  if(!user || !pass){

    loginStatus.textContent =
      "Vui lòng nhập tài khoản và mật khẩu";

    return;
  }

  loginStatus.textContent =
    "Đang đăng nhập...";

  ws.send(JSON.stringify({

    type:"login",

    username:user,

    password:pass

  }));

}


/* =========================
   AUTO LOGIN
========================= */

function tryAutoLogin(){

  const saved =
    localStorage.getItem(
      "wifiCallSession"
    );

  if(!saved){

    showLogin();

    return;

  }

  let session;

  try{

    session = JSON.parse(saved);

  }
  catch{

    localStorage.removeItem(
      "wifiCallSession"
    );

    showLogin();

    return;

  }

  if(
    !session.username ||
    !session.token
  ){

    localStorage.removeItem(
      "wifiCallSession"
    );

    showLogin();

    return;

  }

  pendingSession = true;

  ws.send(JSON.stringify({

    type:"session-login",

    username:session.username,

    token:session.token

  }));

}


/* =========================
   LOGOUT
========================= */

function logout(){

  if(ws && ws.readyState === WebSocket.OPEN){

    ws.send(JSON.stringify({

      type:"logout"

    }));

  }
  else{

    localStorage.removeItem(
      "wifiCallSession"
    );

    username="";

    showLogin();

  }

}


/* =========================
   ROOM
========================= */

function joinRoom(){

  const room =
    document.getElementById(
      "roomInput"
    ).value.trim();

  if(!room){

    roomStatus.textContent =
      "⚠️ Nhập tên phòng";

    return;

  }

  currentRoom = room;

  ws.send(JSON.stringify({

    type:"join",

    room:room

  }));

  roomStatus.textContent =
    "🟢 Đang ở phòng: " + room;

  callStatus.textContent =
    "Sẵn sàng gọi";

}


/* =========================
   CHAT
========================= */

function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!text) return;

  if(!currentRoom){

    alert("Hãy vào phòng trước!");

    return;

  }

  ws.send(JSON.stringify({

    type:"chat",

    text:text

  }));

  input.value="";

}


function addMessage(message){

  const div =
    document.createElement("div");

  div.className =
    "message";

  if(message.from === username){

    div.classList.add("me");

  }

  const name =
    document.createElement("div");

  name.className =
    "message-name";

  name.textContent =
    message.from;

  const text =
    document.createElement("div");

  text.textContent =
    message.text;

  const time =
    document.createElement("div");

  time.className =
    "message-time";

  time.textContent =
    new Date(
      message.time
    ).toLocaleTimeString(
      "vi-VN",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  div.appendChild(name);
  div.appendChild(text);
  div.appendChild(time);

  chatBox.appendChild(div);

  chatBox.scrollTop =
    chatBox.scrollHeight;

}


/* =========================
   WEBRTC
========================= */

const rtcConfig = {

  iceServers:[

    {
      urls:
        "stun:stun.l.google.com:19302"
    }

  ]

};


async function joinCall(){

  if(!currentRoom){

    alert(
      "Hãy vào phòng trước!"
    );

    return;

  }

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio:true,
        video:false

      });

    callStatus.textContent =
      "🎤 Micro đã bật";

    await createPeerConnection();

    await createOffer();

  }
  catch(error){

    console.error(error);

    callStatus.textContent =
      "❌ Không thể bật microphone";

    alert(
      "Hãy cho phép trình duyệt sử dụng microphone."
    );

  }

}


async function createPeerConnection(){

  if(peerConnection){

    peerConnection.close();

  }

  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }

  peerConnection.onicecandidate =
    event =>{

      if(event.candidate){

        ws.send(JSON.stringify({

          type:"ice-candidate",

          candidate:event.candidate

        }));

      }

    };


  peerConnection.ontrack =
    event =>{

      const audio =
        document.getElementById(
          "remoteAudio"
        );

      audio.srcObject =
        event.streams[0];

      audio.play().catch(()=>{});

      callStatus.textContent =
        "🔊 Đang gọi";

    };


  peerConnection.onconnectionstatechange =
    ()=>{

      if(!peerConnection)
        return;

      const state =
        peerConnection.connectionState;

      if(state === "connected"){

        callStatus.textContent =
          "🟢 Đang gọi";

      }

      if(
        state === "disconnected" ||
        state === "failed"
      ){

        callStatus.textContent =
          "🔴 Cuộc gọi bị ngắt";

      }

    };

}


async function createOffer(){

  if(!peerConnection){

    await createPeerConnection();

  }

  const offer =
    await peerConnection.createOffer();

  await peerConnection.setLocalDescription(
    offer
  );

  ws.send(JSON.stringify({

    type:"offer",

    offer:offer

  }));

}


async function handleWebRTC(data){

  try{

    if(!peerConnection){

      await createPeerConnection();

    }


    if(data.type === "offer"){

      await peerConnection.setRemoteDescription(
        data.offer
      );

      const answer =
        await peerConnection.createAnswer();

      await peerConnection.setLocalDescription(
        answer
      );

      ws.send(JSON.stringify({

        type:"answer",

        answer:answer

      }));

      callStatus.textContent =
        "📞 Đã nhận cuộc gọi";

    }


    if(data.type === "answer"){

      await peerConnection.setRemoteDescription(
        data.answer
      );

      callStatus.textContent =
        "🟢 Đã kết nối";

    }


    if(data.type === "ice-candidate"){

      if(data.candidate){

        await peerConnection.addIceCandidate(
          data.candidate
        );

      }

    }

  }
  catch(error){

    console.error(
      "WebRTC error:",
      error
    );

  }

}


/* =========================
   MICROPHONE
========================= */

function toggleMic(){

  if(!localStream){

    alert(
      "Bạn chưa bắt đầu cuộc gọi."
    );

    return;

  }

  const track =
    localStream.getAudioTracks()[0];

  if(!track) return;

  track.enabled =
    !track.enabled;

  document.getElementById(
    "micBtn"
  ).textContent =
    track.enabled
      ? "🎤 Mic"
      : "🔇 Mic tắt";

}


/* =========================
   HANG UP
========================= */

function hangup(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        track.stop();
      });

    localStream=null;

  }

  if(peerConnection){

    peerConnection.close();

    peerConnection=null;

  }

  document.getElementById(
    "remoteAudio"
  ).srcObject=null;

  callStatus.textContent =
    "Đã kết thúc cuộc gọi";

}


/* =========================
   CLOSE PEER
========================= */

function closePeer(){

  if(peerConnection){

    peerConnection.close();

    peerConnection=null;

  }

}


/* =========================
   START
========================= */

async function start(){

  try{

    await connect();

    /*
     * Sau khi WebSocket mở,
     * kiểm tra token đã lưu.
