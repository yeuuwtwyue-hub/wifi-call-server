<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Call</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#0f172a;
  color:white;
  min-height:100vh
}

button{
  border:0;
  cursor:pointer;
  color:white;
  font-weight:bold
}

input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #475569;
  background:#0f172a;
  color:white;
  outline:none
}

.hidden{
  display:none!important
}

/* LOADING */

#loading{
  position:fixed;
  inset:0;
  background:#0f172a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  font-size:20px
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.auth-card{
  width:100%;
  max-width:430px;
  background:#1e293b;
  padding:25px;
  border-radius:22px;
  box-shadow:0 15px 50px #0007
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:20px
}

.auth-card input{
  margin:6px 0
}

.primary{
  width:100%;
  background:#2563eb;
  padding:13px;
  border-radius:12px;
  margin-top:8px
}

.secondary{
  width:100%;
  background:#475569;
  padding:13px;
  border-radius:12px;
  margin-top:8px
}

.status{
  text-align:center;
  color:#fbbf24;
  min-height:20px;
  margin-top:10px
}

/* APP */

#appPage{
  min-height:100vh
}

.header{
  background:#1e293b;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20
}

.header-title{
  font-size:22px;
  font-weight:bold
}

.header-user{
  color:#38bdf8;
  font-size:13px;
  margin-top:3px
}

.menu-btn{
  background:#334155;
  padding:10px 13px;
  border-radius:10px;
  font-size:20px
}

.content{
  max-width:650px;
  margin:auto;
  padding:15px
}

.section{
  background:#1e293b;
  border-radius:17px;
  padding:15px;
  margin-bottom:15px
}

.section h3{
  margin-bottom:12px
}

/* SEARCH */

.search-row{
  display:flex;
  gap:8px
}

.search-row input{
  margin:0
}

.search-btn{
  width:70px;
  border-radius:12px;
  background:#2563eb
}

.search-results{
  margin-top:10px
}

.search-user{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#334155;
  padding:10px;
  border-radius:12px;
  margin-top:7px
}

.search-name{
  font-weight:bold
}

.add-btn{
  background:#22c55e;
  padding:9px 12px;
  border-radius:10px
}

/* REQUESTS */

.request{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#334155;
  padding:10px;
  border-radius:12px;
  margin-top:7px
}

.request-buttons{
  display:flex;
  gap:5px
}

.accept{
  background:#22c55e;
  padding:8px 10px;
  border-radius:9px
}

.reject{
  background:#ef4444;
  padding:8px 10px;
  border-radius:9px
}

/* FRIENDS */

.friend{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#334155;
  padding:12px;
  border-radius:12px;
  margin-top:7px;
  cursor:pointer
}

.friend-left{
  display:flex;
  align-items:center;
  gap:10px
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold
}

.online{
  color:#22c55e;
  font-size:12px
}

.offline{
  color:#94a3b8;
  font-size:12px
}

/* PRIVATE CHAT */

.chat-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px
}

.back{
  background:#475569;
  padding:8px 11px;
  border-radius:10px
}

.chat-title{
  font-weight:bold;
  font-size:18px
}

.chat-box{
  height:350px;
  overflow-y:auto;
  background:#0f172a;
  padding:10px;
  border-radius:12px
}

.message{
  background:#334155;
  padding:9px 11px;
  border-radius:12px;
  margin-bottom:7px;
  max-width:80%;
  width:max-content
}

.message.me{
  background:#2563eb;
  margin-left:auto
}

.message-name{
  font-size:11px;
  color:#cbd5e1;
  margin-bottom:3px
}

.message-time{
  font-size:10px;
  color:#cbd5e1;
  margin-top:3px
}

.send-row{
  display:flex;
  gap:7px;
  margin-top:8px
}

.send-row input{
  margin:0
}

.send-btn{
  width:70px;
  border-radius:12px;
  background:#22c55e
}

/* ROOM */

.room-row{
  display:flex;
  gap:8px
}

.room-row input{
  margin:0
}

.room-btn{
  width:80px;
  border-radius:12px;
  background:#2563eb
}

.info{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin-top:8px
}

/* CALL */

.call-buttons{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.call-buttons button{
  flex:1;
  min-width:100px;
  padding:12px;
  border-radius:11px
}

.call{
  background:#22c55e
}

.mic{
  background:#f59e0b
}

.hang{
  background:#ef4444
}

.logout{
  width:100%;
  padding:13px;
  border-radius:12px;
  background:#475569
}
</style>
</head>

<body>

<div id="loading">
  🔄 Đang kết nối...
</div>


<!-- =====================
     LOGIN
===================== -->

<div id="loginPage" class="auth hidden">

  <div class="auth-card">

    <div class="logo">
      📞 WiFi Call
    </div>

    <div class="subtitle">
      Đăng nhập tài khoản
    </div>

    <input
      id="loginUser"
      placeholder="Tên đăng nhập"
      autocomplete="username">

    <input
      id="loginPass"
      type="password"
      placeholder="Mật khẩu"
      autocomplete="current-password">

    <button
      class="primary"
      onclick="login()">
      Đăng nhập
    </button>

    <button
      class="secondary"
      onclick="showRegister()">
      Tạo tài khoản
    </button>

    <div
      id="loginStatus"
      class="status">
    </div>

  </div>

</div>


<!-- =====================
     REGISTER
===================== -->

<div id="registerPage" class="auth hidden">

  <div class="auth-card">

    <div class="logo">
      📝 Đăng ký
    </div>

    <div class="subtitle">
      Tạo tài khoản mới
    </div>

    <input
      id="registerUser"
      placeholder="Tên đăng nhập">

    <input
      id="registerPass"
      type="password"
      placeholder="Mật khẩu">

    <button
      class="primary"
      onclick="register()">
      Đăng ký
    </button>

    <button
      class="secondary"
      onclick="showLogin()">
      Quay lại
    </button>

    <div
      id="registerStatus"
      class="status">
    </div>

  </div>

</div>


<!-- =====================
     APP
===================== -->

<div id="appPage" class="hidden">

  <div class="header">

    <div>
      <div class="header-title">
        📞 WiFi Call
      </div>

      <div
        id="headerUser"
        class="header-user">
      </div>
    </div>

  </div>


  <div class="content">


    <!-- SEARCH -->

    <div class="section">

      <h3>🔎 Tìm bạn</h3>

      <div class="search-row">

        <input
          id="searchInput"
          placeholder="Nhập tên người dùng..."
          onkeydown="if(event.key==='Enter')searchUsers()">

        <button
          class="search-btn"
          onclick="searchUsers()">
          🔎
        </button>

      </div>

      <div
        id="searchResults"
        class="search-results">
      </div>

    </div>


    <!-- REQUESTS -->

    <div class="section">

      <h3>
        🔔 Lời mời kết bạn
      </h3>

      <div id="requests">
        <div class="info">
          Không có lời mời mới
        </div>
      </div>

    </div>


    <!-- FRIENDS -->

    <div class="section">

      <h3>
        👥 Danh sách bạn
      </h3>

      <div id="friends">
        <div class="info">
          Chưa có bạn bè
        </div>
      </div>

    </div>


    <!-- PRIVATE CHAT -->

    <div
      id="privateChatSection"
      class="section hidden">

      <div class="chat-header">

        <button
          class="back"
          onclick="closePrivateChat()">
          ←
        </button>

        <div
          id="privateChatTitle"
          class="chat-title">
          Chat
        </div>

      </div>

      <div
        id="privateChatBox"
        class="chat-box">
      </div>

      <div class="send-row">

        <input
          id="privateMessage"
          placeholder="Nhắn tin..."
          onkeydown="if(event.key==='Enter')sendPrivateMessage()">

        <button
          class="send-btn"
          onclick="sendPrivateMessage()">
          Gửi
        </button>

      </div>

    </div>


    <!-- ROOM CALL -->

    <div class="section">

      <h3>
        🏠 Phòng gọi
      </h3>

      <div class="room-row">

        <input
          id="roomInput"
          placeholder="Tên phòng">

        <button
          class="room-btn"
          onclick="joinRoom()">
          Vào
        </button>

      </div>

      <div
        id="roomInfo"
        class="info">
        Chưa vào phòng
      </div>

    </div>


    <!-- CALL -->

    <div class="section">

      <h3>
        📞 Gọi
      </h3>

      <div class="call-buttons">

        <button
          class="call"
          onclick="startCall()">
          📞 Gọi
        </button>

        <button
          id="micButton"
          class="mic"
          onclick="toggleMic()">
          🎤 Mic
        </button>

        <button
          class="hang"
          onclick="hangup()">
          ❌ Cúp
        </button>

      </div>

      <div
        id="callInfo"
        class="info">
        Chưa gọi
      </div>

    </div>


    <!-- LOGOUT -->

    <div class="section">

      <button
        class="logout"
        onclick="logout()">
        🚪 Đăng xuất
      </button>

    </div>

  </div>

</div>


<audio
  id="remoteAudio"
  autoplay>
</audio>


<script>

/* =====================
   SERVER
===================== */

const SERVER =
"https://wifi-call-server-1.onrender.com";


let ws=null;

let username="";

let currentRoom="";

let selectedFriend="";

let localStream=null;

let peer=null;


/* =====================
   PAGE
===================== */

function hideLoading(){

  document
    .getElementById("loading")
    .classList.add("hidden");

}


function showLogin(){

  hideLoading();

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("registerPage")
    .classList.add("hidden");

  document
    .getElementById("appPage")
    .classList.add("hidden");

}


function showRegister(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("registerPage")
    .classList.remove("hidden");

}


function showApp(){

  hideLoading();

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("registerPage")
    .classList.add("hidden");

  document
    .getElementById("appPage")
    .classList.remove("hidden");

  document
    .getElementById("headerUser")
    .textContent=
      "👤 "+username;

  loadFriends();

  loadRequests();

}


/* =====================
   WEBSOCKET
===================== */

function connect(){

  return new Promise(
    (resolve,reject)=>{

      const url=
        SERVER.replace(
          /^http/,
          "ws"
        );

      ws=
        new WebSocket(url);

      let done=false;

      const timer=
        setTimeout(()=>{

          if(done)return;

          done=true;

          reject(
            new Error("timeout")
          );

        },8000);


      ws.onopen=()=>{

        if(done)return;

        done=true;

        clearTimeout(timer);

        resolve();

      };


      ws.onerror=()=>{

        if(done)return;

        done=true;

        clearTimeout(timer);

        reject(
          new Error("error")
        );

      };


      ws.onclose=()=>{

        const info=
          document.getElementById(
            "roomInfo"
          );

        if(info){

          info.textContent=
            "🔴 Mất kết nối máy chủ";

        }

      };


      ws.onmessage=e=>{

        let data;

        try{

          data=
            JSON.parse(e.data);

        }catch{

          return;

        }

        handleMessage(data);

      };

    }
  );

}


/* =====================
   HANDLE
===================== */

function handleMessage(data){


  /* LOGIN */

  if(
    data.type===
    "login-result"
  ){

    if(!data.success){

      document
        .getElementById(
          "loginStatus"
        )
        .textContent=
          data.message;

      return;

    }


    username=
      data.username;


    const user=
      document
        .getElementById(
          "loginUser"
        )
        .value.trim();


    const pass=
      document
        .getElementById(
          "loginPass"
        )
        .value;


    ws.send(
      JSON.stringify({

        type:
          "create-session",

        username:user,

        password:pass

      })
    );

    return;
  }


  /* SESSION */

  if(
    data.type===
    "session-created"
  ){

    if(data.success){

      localStorage.setItem(
        "wifiCallSession",
        JSON.stringify({

          username:
            data.username,

          token:
            data.token

        })
      );

      username=
        data.username;

      showApp();

    }

    return;
  }


  /* AUTO LOGIN */

  if(
    data.type===
    "session-result"
  ){

    if(data.success){

      username=
        data.username;

      showApp();

    }else{

      localStorage.removeItem(
        "wifiCallSession"
      );

      showLogin();

    }

    return;
  }


  /* REGISTER */

  if(
    data.type===
    "register-result"
  ){

    document
      .getElementById(
        "registerStatus"
      )
      .textContent=
        data.message || "";


    if(data.success){

      setTimeout(
        showLogin,
        700
      );

    }

    return;
  }


  /* LOGOUT */

  if(
    data.type===
    "logout-result"
  ){

    localStorage.removeItem(
      "wifiCallSession"
    );

    username="";

    showLogin();

    return;
  }


  /* SEARCH */

  if(
    data.type===
    "search-results"
  ){

    showSearchResults(
      data.users
    );

    return;
  }


  /* FRIEND REQUEST */

  if(
    data.type===
    "friend-request-result"
  ){

    alert(
      data.message
    );

    return;
  }


  /* REQUEST RECEIVED */

  if(
    data.type===
    "friend-request-received"
  ){

    alert(
      "🔔 "+data.from+
      " đã gửi lời mời kết bạn"
    );

    loadRequests();

    return;
  }


  /* REQUEST LIST */

  if(
    data.type===
    "friend-requests"
  ){

    showRequests(
      data.requests
    );

    return;
  }


  /* FRIEND ACTION */

  if(
    data.type===
    "friend-action-result"
  ){

    alert(
      data.message
    );

    loadRequests();

    loadFriends();

    return;
  }


  /* FRIEND ADDED */

  if(
    data.type===
    "friend-added"
  ){

    loadFriends();

    return;
  }


  /* FRIEND LIST */

  if(
    data.type===
    "friend-list"
  ){

    showFriends(
      data.friends
    );

    return;
  }


  /* PRIVATE HISTORY */

  if(
    data.type===
    "private-chat-history"
  ){

    selectedFriend=
      data.username;

    document
      .getElementById(
        "privateChatTitle"
      )
      .textContent=
        "💬 "+selectedFriend;

    const box=
      document
        .getElementById(
          "privateChatBox"
        );

    box.innerHTML="";

    data.messages.forEach(
      addPrivateMessage
    );

    box.scrollTop=
      box.scrollHeight;

    document
      .getElementById(
        "privateChatSection"
      )
      .classList.remove(
        "hidden"
      );

    return;
  }


  /* PRIVATE MESSAGE */

  if(
    data.type===
    "private-chat"
  ){

    const m=
      data.message;


    if(
      selectedFriend ===
      m.from ||
      selectedFriend ===
      m.to
    ){

      addPrivateMessage(
        m
      );

    }

    return;
  }


  /* PRIVATE ERROR */

  if(
    data.type===
    "private-chat-error"
  ){

    alert(
      data.message
    );

    return;
  }


  /* ROOM CHAT */

  if(
    data.type===
    "chat"
  ){

    return;
  }


  /* CALL */

  if(
    data.type===
    "peer-joined"
  ){

    document
      .getElementById(
        "callInfo"
      )
      .textContent=
        "👤 Có người vào phòng";

    return;
  }


  if(
    data.type===
    "peer-left"
  ){

    closePeer();

    document
      .getElementById(
        "callInfo"
      )
      .textContent=
        "👤 Người kia đã rời";

    return;
  }


  if(
    data.type===
      "offer" ||
    data.type===
      "answer" ||
    data.type===
      "ice-candidate"
  ){

    handleRTC(data);

    return;
  }

}


/* =====================
   REGISTER
===================== */

function register(){

  const user=
    document
      .getElementById(
        "registerUser"
      )
      .value.trim();

  const pass=
    document
      .getElementById(
        "registerPass"
      )
      .value;


  if(!user||!pass){

    document
      .getElementById(
        "registerStatus"
      )
      .textContent=
        "Nhập đầy đủ thông tin";

    return;

  }


  ws.send(
    JSON.stringify({

      type:
        "register",

      username:
        user,

      password:
        pass

    })
  );

}


/* =====================
   LOGIN
===================== */

function login(){

  const user=
    document
      .getElementById(
        "loginUser"
      )
      .value.trim();

  const pass=
    document
      .getElementById(
        "loginPass"
      )
      .value;


  if(!user||!pass){

    document
      .getElementById(
        "loginStatus"
      )
      .textContent=
        "Nhập tài khoản và mật khẩu";

    return;

  }


  ws.send(
    JSON.stringify({

      type:
        "login",

      username:
        user,

      password:
        pass

    })
  );

}


/* =====================
   AUTO LOGIN
===================== */

function autoLogin(){

  const saved=
    localStorage.getItem(
      "wifiCallSession"
    );


  if(!saved){

    showLogin();

    return;

  }


  let session;


  try{

    session=
      JSON.parse(
        saved
      );

  }catch{

    localStorage.removeItem(
      "wifiCallSession"
    );

    showLogin();

    return;

  }


  if(
    !session.username ||
    !session.token
  ){

    localStorage.removeItem(
      "wifiCallSession"
    );

    showLogin();

    return;

  }


  ws.send(
    JSON.stringify({

      type:
        "session-login",

      username:
        session.username,

      token:
        session.token

    })
  );

}


/* =====================
   SEARCH USERS
===================== */

function searchUsers(){

  const query=
    document
      .getElementById(
        "searchInput"
      )
      .value.trim();


  if(!query){

    document
      .getElementById(
        "searchResults"
      )
      .innerHTML=
        "<div class='info'>Nhập tên cần tìm</div>";

    return;

  }


  ws.send(
    JSON.stringify({

      type:
        "search-users",

      query:
        query

    })
  );

}


function showSearchResults(users){

  const box=
    document
      .getElementById(
        "searchResults"
      );

  box.innerHTML="";


  if(!users.length){

    box.innerHTML=
      "<div class='info'>Không tìm thấy</div>";

    return;

  }


  users.forEach(
    user=>{

      const div=
        document.createElement(
          "div"
        );

      div.className=
        "search-user";


      const name=
        document.createElement(
          "div"
        );

      name.className=
        "search-name";

      name.textContent=
        "👤 "+user.username;


      const button=
        document.createElement(
          "button"
        );

      button.className=
        "add-btn";

      if(user.friend){

        button.textContent=
          "✅ Bạn bè";

        button.disabled=true;

      }else{

        button.textContent=
          "➕ Kết bạn";

        button.onclick=()=>{

          sendFriendRequest(
            user.username
          );
